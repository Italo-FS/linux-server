
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Linux & Server — Cheatsheet</title>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="header-content">
        <h1>Linux <span>&</span> Server</h1>

        <p>
          Guia rápido de comandos essenciais para administração
          de servidores, terminal Linux e ambientes Docker.
        </p>

        <div class="header-meta">
          <span class="meta-badge" id="totalCommands">
            0 comandos
          </span>

          <span class="meta-badge" id="totalCategories">
            0 categorias
          </span>

          <span class="meta-badge">
            $ terminal
          </span>
        </div>

      </div>
    </header>

    <div class="toolbar">

      <div class="search">

        <svg
          class="search-icon"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar comandos, descrições ou categorias..."
          aria-label="Buscar comandos"
          autocomplete="off"
        />

      </div>

      <button
        class="btn"
        id="clearButton"
        type="button"
      >
        Limpar
      </button>

      <button
        class="btn btn-primary"
        id="printButton"
        type="button"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 9V2h12v7" />
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
          <path d="M6 14h12v8H6z" />
        </svg>

        Imprimir / PDF
      </button>

    </div>

    <nav
      class="categories"
      id="categoryFilters"
      aria-label="Filtrar por categoria"
    ></nav>

    <div
      class="content"
      id="content"
    ></div>

    <footer class="footer">
      <span>LINUX & SERVER / CHEATSHEET</span>
      <span>Quick reference · Terminal commands</span>
    </footer>

  </main>

  <script src="js/commands.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
